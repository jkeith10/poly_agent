[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-intelligence"
version = "0.1.0"
description = "Auditable prediction-market intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["aiosqlite>=0.20,<1", "mypy>=1.14,<2", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.setuptools]
packages = ["oracle", "oracle.common", "oracle.scanner", "oracle.research", "oracle.evidence", "oracle.probability", "oracle.valuation", "oracle.portfolio", "oracle.learning", "oracle.ai", "oracle.alerts", "oracle.providers", "oracle.database", "oracle.observability", "oracle_api", "oracle_worker"]
package-dir = {"oracle" = "packages/common/src/oracle", "oracle.common" = "packages/common/src/oracle/common", "oracle.scanner" = "packages/scanner/src/oracle/scanner", "oracle.research" = "packages/research/src/oracle/research", "oracle.evidence" = "packages/evidence/src/oracle/evidence", "oracle.probability" = "packages/probability/src/oracle/probability", "oracle.valuation" = "packages/valuation/src/oracle/valuation", "oracle.portfolio" = "packages/portfolio/src/oracle/portfolio", "oracle.learning" = "packages/learning/src/oracle/learning", "oracle.ai" = "packages/ai/src/oracle/ai", "oracle.alerts" = "packages/alerts/src/oracle/alerts", "oracle.providers" = "packages/providers/src/oracle/providers", "oracle.database" = "packages/database/src/oracle/database", "oracle.observability" = "packages/observability/src/oracle/observability", "oracle_api" = "apps/api/src/oracle_api", "oracle_worker" = "apps/worker/src/oracle_worker"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
